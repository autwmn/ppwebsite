name: Daily Sync
on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Clean HTML files (remove all comments)
        run: |
          for file in $(find . -name "*.html" -not -path "./node_modules/*" -not -path "./.git/*"); do
            sed -i '/<\!--/,/-->/d' "$file"
          done
      
      - name: Commit and push
        run: |
          git config user.email "autumnjoyner06@gmail.com"
          git config user.name "Autumn Joyner"
          git add .
          git commit -m "Daily sync: $(date +%Y-%m-%d)" || true
          git push origin main
